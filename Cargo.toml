[workspace]
resolver = "3"
members = ["app", "frontend", "server", "domain", "api", "infra", "ui"]

[workspace.package]
authors = ["TrifingZW <email@gmail.com>"]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# 工作空间
app = { path = "app", default-features = false }
api = { path = "api", default-features = false }
domain = { path = "domain", default-features = false }
infra = { path = "infra", default-features = false }
ui = { path = "ui", default-features = false }

# Leptos 核心
leptos = "0.8.23"
leptos_axum = "0.8.10"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
server_fn = { version = "0.8.13", features = ["multipart"] }

# Axum 与服务器
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
axum-server = { version = "0.9.2", features = ["tls-openssl"] }

# HTTP 基础设施
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "limit", "set-header"] }

# 数据库
sqlx = { version = "0.9.1", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }

# 异步运行时
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread"] }

# 日志与追踪
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "local-time",
] }

# Web 与浏览器
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
log = "0.4.35"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.83", features = [
    "Blob",
    "Document",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FormData",
    "HtmlInputElement",
    "Window",
] }

# JWT 认证
jsonwebtoken = { version = "12.0.0", default-features = false, features = [
    "rust_crypto",
] }

# 密码哈希
argon2 = "0.5.3"

# 序列化
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

# Error
anyhow = "1.0.104"
thiserror = "2.0.21"

# 其他工具
time = { version = "0.3.55", features = [
    "formatting",
    "local-offset",
    "macros",
] }
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
# 服务端不设 panic = "abort"：保留栈展开，运行期 panic 仅终止单个连接而非整个进程
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"

# wasm 前端专用：继承服务端体积优化，恢复 abort 裁剪栈展开开销
[profile.wasm-release]
inherits = "release"
panic = "abort"

# 全部参数说明见 https://github.com/leptos-rs/cargo-leptos
# 一个 Leptos 项目由工作区中共同使用的前端库与服务端二进制组成
[[workspace.metadata.leptos]]
# 用于 wasm、js 与 css 文件名
name = "asdfri"

# 包含服务端二进制的工作区包（二进制 crate）
bin-package = "server"

# 包含前端 wasm 二进制的工作区包（库 crate）
lib-package = "frontend"

# 构建产物根目录；每次重建都会清空，请勿存放其他内容
# 服务端需使用该路径
site-root = "target/site"

# 构建产物在 site-root 下的相对目录（JS、WASM 与 CSS）
# 默认 pkg
site-pkg-dir = "pkg"

# 为构建产物文件名追加内容哈希，使新旧版本拥有不同 URL
# 部署时须将生成的 hash.txt 与服务器二进制放在同一目录
hash-files = true

# [可选] 源样式文件；以 .sass 或 .scss 结尾时由 dart-sass 编译，
# 并经 Lightning CSS 优化后写入 <site-root>/<site-pkg>/asdfri.css
style-file = "style/main.scss"

# 静态资源源目录；其中所有文件会复制并同步到 site-root
# 该目录不能包含与 site-pkg-dir 同名或同路径的子目录
#
# 可选。环境变量：LEPTOS_ASSETS_DIR
assets-dir = "public"

# 用于优化 CSS 的 browserslist 查询
browserquery = "defaults"

# 开发构建的监听地址（经 LEPTOS_SITE_ADDR 注入）
# release 构建以 config.toml 的 [server] 为准
site-addr = "127.0.0.1:3000"

# 自动重载监听的端口
reload-port = 3001

# [可选] 运行端到端测试的命令，在 end2end 目录中执行
#   [Windows] 非 WSL 环境使用 "npx.cmd playwright test"
#   可在 PowerShell 中用 Get-Command npx 检查该二进制名称
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

# 编译 bin 目标时使用的特性
#
# 可选。可通过命令行参数 --bin-features 覆盖
bin-features = []

# 编译 bin 目标时是否使用 --no-default-features
#
# 可选。默认 false
bin-default-features = false

# 编译 lib 目标时使用的特性
#
# 可选。可通过命令行参数 --lib-features 覆盖
lib-features = []

# 编译 lib 目标时是否使用 --no-default-features
#
# 可选。默认 false
lib-default-features = false

# lib 目标 release 构建使用的 Cargo profile
# 服务端 release 保留栈展开以隔离 panic，wasm 目标沿用 abort 压缩产物体积
lib-profile-release = "wasm-release"
