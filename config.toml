# 应用配置：修改后重启生效

[auth]
# 留空时使用进程内临时密钥（重启将使现有会话失效）；生产环境请填入随机字符串
jwt_secret = ""
jwt_ttl_hours = 24

[database]
max_connections = 5
url = "sqlite:asdfri.db?mode=rwc"

# 以下监听项用于 release 构建；开发构建使用 LEPTOS_SITE_ADDR
[server]
# 监听主机，须为 IP 字面量
host = "0.0.0.0"
# 未启用 TLS 时直接提供 HTTP 服务；启用 TLS 时仅用于 HTTPS 重定向
http_port = 80
# HTTPS 监听端口，仅在启用 TLS 时生效
https_port = 443

[server.tls]
# 生成方式见 self_signed_certs/README.md；启用前请确认文件存在
enabled = false
cert = "self_signed_certs/asdfri.crt"
key = "self_signed_certs/asdfri.key"

[upload]
# 上传图片存储目录；相对路径基于服务端工作目录
# 该目录独立于 target/site，重新构建不会丢失文件
dir = "uploads"
